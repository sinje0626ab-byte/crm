<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#dfeaf6" />
<title>설원 바베큐 타이쿤</title>
<style>
  :root {
    --ink: #f4ecdc;
    --panel: rgba(28, 24, 20, 0.86);
    --gold: #e8b23c;
    --gold-soft: rgba(232, 178, 60, 0.5);
    --shadow: 0 6px 18px rgba(40, 28, 12, 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #dfeaf6;
    font-family: "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); user-select: none; touch-action: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #surface { position: fixed; inset: 0; touch-action: none; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }

  #ui { position: fixed; inset: 0; pointer-events: none; transition: opacity 0.3s; }
  .panel { background: var(--panel); border: 3px solid var(--gold-soft); border-radius: 16px; box-shadow: var(--shadow); }

  /* 상단 왼쪽: 일시정지 · 소리 */
  #top-left { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; }
  #btn-pause, #btn-mute {
    pointer-events: auto; width: 46px; height: 46px; display: grid; place-items: center;
    font-size: 22px; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 3px solid var(--gold-soft); border-radius: 14px;
  }
  #btn-mute svg { width: 22px; height: 22px; fill: currentColor; }
  #btn-mute .off { display: none; }
  #btn-mute.muted { color: #9b9286; }
  #btn-mute.muted .on { display: none; }
  #btn-mute.muted .off { display: block; }

  /* 상단 오른쪽: 현금 */
  #money-pill {
    position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 9px;
    padding: 7px 16px 7px 10px; font-size: 24px; font-weight: bold; letter-spacing: 0.5px;
    background: rgba(28, 24, 20, 0.8); border: 3px solid rgba(255, 255, 255, 0.55); border-radius: 999px;
    box-shadow: var(--shadow); transition: transform 0.12s ease; color: #fff;
  }
  #money-pill.bump { transform: scale(1.14); }
  .bill {
    width: 34px; height: 22px; border-radius: 5px; display: grid; place-items: center;
    background: linear-gradient(#77e08e, #3fb264); border: 2px solid #2d8e4d;
  }
  .bill::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #e3fbe9; }

  /* 적재 표시 */
  #carry-wrap {
    position: absolute; top: 68px; left: 12px; display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 13px; font-size: 16px; font-weight: bold; transition: opacity 0.2s, transform 0.2s;
  }
  #carry-wrap.full { color: #ffd98a; animation: pulse 0.8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .carry-icon { width: 20px; height: 14px; border-radius: 7px; background: #d6453c; }
  .carry-icon.plate { background: #fdf8ef; border: 2px solid #c8bda8; border-radius: 50%; height: 16px; }
  .carry-icon.cash { background: linear-gradient(#77e08e, #3fb264); border-radius: 4px; }

  #hint {
    position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 9px 20px; font-size: 14px; font-weight: bold;
    text-align: center; white-space: nowrap; background: rgba(28, 24, 20, 0.7); border-radius: 999px;
  }
  #toast {
    position: absolute; left: 50%; top: 80px; transform: translate(-50%, -12px);
    padding: 11px 24px; font-size: 18px; font-weight: bold;
    background: #1c1814; border: 3px solid var(--gold); border-radius: 999px;
    box-shadow: var(--shadow); opacity: 0; transition: opacity 0.2s, transform 0.2s;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 조이스틱 */
  #joy {
    position: fixed; width: 126px; height: 126px; margin: -63px 0 0 -63px; border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.18);
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  #joy.on { opacity: 1; }
  #joy-knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.95); box-shadow: var(--shadow);
  }

  /* 인트로 · 메뉴 · 일시정지 */
  #intro {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: #000; cursor: pointer; transition: opacity 0.6s;
  }
  #intro.done { opacity: 0; pointer-events: none; }
  .splash-logo { width: min(420px, 86vw); height: auto; opacity: 1; animation: splashIn 3s ease forwards; }
  @keyframes splashIn {
    0% { opacity: 0; transform: scale(0.86); }
    12% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.02); }
  }
  @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; opacity: 1; } }

  #menu, #pause {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(rgba(20, 16, 12, 0.5), rgba(20, 16, 12, 0.8));
    transition: opacity 0.3s;
  }
  #pause { z-index: 25; background: rgba(20, 16, 12, 0.72); }
  .card { width: min(380px, 86vw); padding: 26px 22px; text-align: center; }
  .card h1 { margin: 0 0 4px; font-size: clamp(24px, 6.5vw, 34px); }
  .card h2 { margin: 0 0 14px; font-size: 22px; }
  .card .en { margin: 0 0 20px; font-size: 12px; letter-spacing: 0.36em; opacity: 0.6; }
  .btn {
    pointer-events: auto; display: block; width: 100%; margin: 9px 0; padding: 14px;
    font-size: 17px; font-weight: bold; font-family: inherit; color: #2a1e0c; cursor: pointer;
    background: linear-gradient(#f5d98f, #e0a83c); border: none; border-bottom: 4px solid #a2761f;
    border-radius: 12px; transition: transform 0.08s;
  }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .btn.ghost { color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 2px solid var(--gold-soft); }
  .btn:disabled { opacity: 0.38; cursor: default; }
  .note { margin-top: 12px; font-size: 12px; opacity: 0.62; }

  #loading {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: #000; color: var(--gold); font-weight: bold; transition: opacity 0.4s;
  }

  @media (max-width: 480px) {
    #money-pill { font-size: 20px; }
    #hint { font-size: 12px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="surface"></div>

<div id="ui" class="hidden">
  <div id="top-left">
    <div id="btn-pause">☰</div>
    <div id="btn-mute" title="소리">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1c3 .9 5 3.5 5 6.7s-2 5.8-5 6.7v2.1c4.1-1 7-4.5 7-8.8s-2.9-7.8-7-8.8z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm15.5 3 2.5-2.5-1.4-1.4L18 10.6 15.4 8 14 9.4l2.6 2.6L14 14.6l1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4L19.5 12z"/></svg>
    </div>
  </div>

  <div id="money-pill"><span class="bill"></span><span id="money">0</span></div>
  <div id="carry-wrap" class="panel hidden"><span id="carry-icon" class="carry-icon"></span><span id="carry">0/8</span></div>

  <div id="toast"></div>
  <div id="hint">위쪽 문으로 나가 곰을 사냥하세요</div>
</div>

<div id="joy"><div id="joy-knob"></div></div>

<div id="menu" class="hidden">
  <div class="card panel">
    <h1>설원 바베큐 타이쿤</h1>
    <p class="en">SNOW BBQ TYCOON</p>
    <button id="btn-continue" class="btn">이어하기</button>
    <button id="btn-new" class="btn ghost">새 게임</button>
    <p id="save-info" class="note">저장된 기록이 없습니다</p>
  </div>
</div>

<div id="pause" class="hidden">
  <div class="card panel">
    <h2>일시정지</h2>
    <button id="btn-resume" class="btn">계속하기</button>
    <button id="btn-save" class="btn ghost">저장하기</button>
    <button id="btn-sound" class="btn ghost">소리 끄기</button>
    <button id="btn-quit" class="btn ghost">저장하고 메뉴로</button>
    <p id="pause-save-info" class="note"></p>
  </div>
</div>

<div id="intro"><img class="splash-logo" src="../assets/yj-games.webp" alt="YJ GAMES" /></div>
<div id="loading">불러오는 중...</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
