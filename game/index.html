<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1620" />
<title>화이트아웃 헌터</title>
<style>
  :root {
    --ink: #f2e9d8;
    --panel: rgba(16, 24, 33, 0.88);
    --panel-solid: #121b25;
    --gold: #c9a24a;
    --gold-soft: rgba(201, 162, 74, 0.45);
    --shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d1620;
    font-family: "Trebuchet MS", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink); user-select: none; touch-action: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #surface { position: fixed; inset: 0; touch-action: none; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }

  /* ------------------------------------------------------------ 인게임 UI */
  #ui { position: fixed; inset: 0; pointer-events: none; transition: opacity 0.3s; }
  .panel {
    background: var(--panel);
    border: 2px solid var(--gold-soft);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  #top-left { position: absolute; top: 12px; left: 12px; display: flex; align-items: flex-start; gap: 10px; }
  #btn-pause, #btn-mute {
    pointer-events: auto; width: 46px; height: 46px; display: grid; place-items: center;
    font-size: 22px; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 2px solid var(--gold-soft); border-radius: 14px;
  }
  #btn-mute svg { width: 22px; height: 22px; fill: currentColor; }
  #btn-mute .off { display: none; }
  #btn-mute.muted { color: #8d97a3; }
  #btn-mute.muted .on { display: none; }
  #btn-mute.muted .off { display: block; }
  #vitals { display: flex; flex-direction: column; gap: 7px; }
  #hp-bar { width: 150px; height: 16px; padding: 3px; }
  #hp-fill { height: 100%; width: 100%; border-radius: 6px; background: #5fd07a; transition: width 0.15s linear; }
  #carry-wrap {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
    font-size: 15px; font-weight: bold; transition: opacity 0.2s, transform 0.2s;
  }
  #carry-wrap.full { color: #ffcf5a; border-color: var(--gold); animation: pulse 0.8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .dot { width: 16px; height: 11px; border-radius: 7px; background: #c2453e; }
  #sword-lv { display: inline-block; align-self: flex-start; padding: 3px 9px; font-size: 12px;
    font-weight: bold; background: rgba(13, 22, 32, 0.7); border-radius: 999px; }

  #top-right { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
  .chip {
    display: flex; align-items: center; gap: 7px; padding: 7px 13px;
    font-size: 17px; font-weight: bold; letter-spacing: 0.3px;
  }
  #money-pill { transition: transform 0.12s ease; font-size: 20px; }
  #money-pill.bump { transform: scale(1.12); }
  .ico { width: 22px; height: 16px; border-radius: 4px; }
  .ico.cash { background: linear-gradient(#6fdc8a, #35a05c); border: 2px solid #2b7a48; }
  .ico.wood { background: linear-gradient(#a3703f, #6d4a2c); border: 2px solid #4d3423; border-radius: 6px; }
  .ico.meat { background: linear-gradient(#e0655c, #a83a34); border: 2px solid #7d2b26; border-radius: 8px; }

  /* 낮/밤 표시 */
  #day-chip { gap: 6px; }
  #day-chip.night { color: #bcd2f0; }
  .day-icon {
    width: 15px; height: 15px; border-radius: 50%;
    background: #ffce5a; box-shadow: 0 0 9px rgba(255, 206, 90, 0.7);
  }
  .day-icon.moon {
    background: #d7e6fb; box-shadow: inset -5px 1px 0 rgba(20, 30, 45, 0.9), 0 0 9px rgba(190, 215, 255, 0.5);
  }

  /* 행동 버튼: 모바일은 우측 고정, PC는 캐릭터 옆 키 안내 */
  #action-pad {
    position: absolute; right: calc(18px + env(safe-area-inset-right));
    bottom: calc(26px + env(safe-area-inset-bottom));
    display: none; flex-direction: column-reverse; gap: 14px; pointer-events: none;
  }
  body.touch #action-pad { display: flex; }
  .act-btn {
    position: relative; pointer-events: auto; width: 76px; height: 76px; overflow: hidden;
    display: grid; place-items: center; font-size: 26px; font-weight: bold; color: #22190a;
    background: linear-gradient(#f0d489, #c9a24a); border: 3px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%; box-shadow: var(--shadow); transition: transform 0.08s, opacity 0.2s;
    touch-action: none; user-select: none;
  }
  .act-btn small { position: absolute; bottom: 9px; font-size: 10px; opacity: 0.8; letter-spacing: 0.06em; }
  .act-btn.down { transform: scale(0.92); }
  .act-btn.dim { opacity: 0.45; }
  #btn-skill { background: linear-gradient(#a7d8ff, #4a90c8); }
  #skill-cd {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(10, 18, 28, 0.55); pointer-events: none;
  }

  #key-hints {
    position: absolute; top: 0; left: 0; display: flex; gap: 7px;
    opacity: 0; transition: opacity 0.15s; pointer-events: none; will-change: transform;
  }
  #key-hints.show { opacity: 1; }
  body.touch #key-hints { display: none; }
  .key-cap {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 5px 9px; font-size: 15px; font-weight: bold; color: #22190a;
    background: linear-gradient(#f4dc9c, #c9a24a); border-bottom: 3px solid #8a6c2c;
    border-radius: 9px; box-shadow: var(--shadow); transition: opacity 0.15s;
  }
  .key-cap small { font-size: 9px; font-weight: bold; opacity: 0.85; letter-spacing: 0.04em; }
  .key-cap.skill { background: linear-gradient(#bfe4ff, #4a90c8); border-bottom-color: #2c5f8a; }
  .key-cap.dim { opacity: 0.35; }

  #hint {
    position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%); padding: 8px 18px; font-size: 14px; font-weight: bold;
    text-align: center; white-space: nowrap; background: rgba(13, 22, 32, 0.72); border-radius: 999px;
  }
  #toast {
    position: absolute; left: 50%; top: 80px; transform: translate(-50%, -12px);
    padding: 11px 24px; font-size: 17px; font-weight: bold;
    background: var(--panel-solid); border: 2px solid var(--gold); border-radius: 999px;
    box-shadow: var(--shadow); opacity: 0; transition: opacity 0.2s, transform 0.2s;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(8, 16, 26, 0.55) 100%);
  }
  #damage-flash {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(190, 40, 30, 0.55) 100%);
  }
  #damage-flash.on { animation: dmg 0.45s ease-out; }
  @keyframes dmg { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* --------------------------------------------------------------- 조이스틱 */
  #joy {
    position: fixed; width: 126px; height: 126px; margin: -63px 0 0 -63px; border-radius: 50%;
    border: 3px solid rgba(201, 162, 74, 0.5); background: rgba(13, 22, 32, 0.3);
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  #joy.on { opacity: 1; }
  #joy-knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(233, 226, 208, 0.9); box-shadow: var(--shadow);
  }

  /* -------------------------------------------------------- 인트로 / 메뉴 */
  /* 퍼블리셔 로고 오프닝 — 언데드러쉬와 같은 스플래시 */
  #intro {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: #000; cursor: pointer; transition: opacity 0.6s;
  }
  #intro.done { opacity: 0; pointer-events: none; }
  .splash-logo {
    width: min(420px, 86vw); height: auto; opacity: 1;
    animation: splashIn 2.6s ease forwards;
  }
  @keyframes splashIn {
    0% { opacity: 0; transform: scale(0.86); }
    14% { opacity: 1; transform: scale(1); }
    78% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.02); }
  }
  /* 애니메이션을 줄이는 기기에서도 로고가 보이도록 */
  @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; opacity: 1; } }

  #menu {
    position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: linear-gradient(rgba(8, 15, 22, 0.55), rgba(8, 15, 22, 0.85));
    transition: opacity 0.35s;
  }
  #menu-card { width: min(380px, 86vw); padding: 26px 22px; text-align: center; }
  #menu h1 {
    margin: 0 0 4px; font-size: clamp(26px, 7vw, 38px); letter-spacing: 0.04em;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
  }
  #menu .en { margin: 0 0 20px; font-size: 12px; letter-spacing: 0.42em; opacity: 0.6; }
  .btn {
    pointer-events: auto; display: block; width: 100%; margin: 9px 0; padding: 14px;
    font-size: 17px; font-weight: bold; font-family: inherit; color: #22190a; cursor: pointer;
    background: linear-gradient(#f0d489, #c9a24a); border: none; border-bottom: 4px solid #8a6c2c;
    border-radius: 12px; transition: transform 0.08s;
  }
  .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
  .btn.ghost {
    color: var(--ink); background: rgba(255, 255, 255, 0.06);
    border: 2px solid var(--gold-soft); border-bottom-width: 2px;
  }
  .btn:disabled { opacity: 0.38; cursor: default; }
  .note { margin-top: 12px; font-size: 12px; opacity: 0.6; }

  #pause {
    position: fixed; inset: 0; z-index: 25; display: grid; place-items: center;
    background: rgba(6, 12, 18, 0.72); transition: opacity 0.2s;
  }
  #pause-card { width: min(340px, 84vw); padding: 22px; text-align: center; }
  #pause h2 { margin: 0 0 14px; font-size: 22px; }

  #loading {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: #070e15; color: #c9a24a; font-weight: bold; transition: opacity 0.4s;
  }

  @media (max-width: 480px) {
    .chip { font-size: 15px; padding: 6px 10px; }
    #money-pill { font-size: 17px; }
    #hp-bar { width: 118px; }
    /* 낮/밤 표시 */
  #day-chip { gap: 6px; }
  #day-chip.night { color: #bcd2f0; }
  .day-icon {
    width: 15px; height: 15px; border-radius: 50%;
    background: #ffce5a; box-shadow: 0 0 9px rgba(255, 206, 90, 0.7);
  }
  .day-icon.moon {
    background: #d7e6fb; box-shadow: inset -5px 1px 0 rgba(20, 30, 45, 0.9), 0 0 9px rgba(190, 215, 255, 0.5);
  }

  /* 행동 버튼: 모바일은 우측 고정, PC는 캐릭터 옆 키 안내 */
  #action-pad {
    position: absolute; right: calc(18px + env(safe-area-inset-right));
    bottom: calc(26px + env(safe-area-inset-bottom));
    display: none; flex-direction: column-reverse; gap: 14px; pointer-events: none;
  }
  body.touch #action-pad { display: flex; }
  .act-btn {
    position: relative; pointer-events: auto; width: 76px; height: 76px; overflow: hidden;
    display: grid; place-items: center; font-size: 26px; font-weight: bold; color: #22190a;
    background: linear-gradient(#f0d489, #c9a24a); border: 3px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%; box-shadow: var(--shadow); transition: transform 0.08s, opacity 0.2s;
    touch-action: none; user-select: none;
  }
  .act-btn small { position: absolute; bottom: 9px; font-size: 10px; opacity: 0.8; letter-spacing: 0.06em; }
  .act-btn.down { transform: scale(0.92); }
  .act-btn.dim { opacity: 0.45; }
  #btn-skill { background: linear-gradient(#a7d8ff, #4a90c8); }
  #skill-cd {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(10, 18, 28, 0.55); pointer-events: none;
  }

  #key-hints {
    position: absolute; top: 0; left: 0; display: flex; gap: 7px;
    opacity: 0; transition: opacity 0.15s; pointer-events: none; will-change: transform;
  }
  #key-hints.show { opacity: 1; }
  body.touch #key-hints { display: none; }

    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 5px 9px; font-size: 15px; font-weight: bold; color: #22190a;
    background: linear-gradient(#f4dc9c, #c9a24a); border-bottom: 3px solid #8a6c2c;
    border-radius: 9px; box-shadow: var(--shadow); transition: opacity 0.15s;
  }
  .key-cap small { font-size: 9px; font-weight: bold; opacity: 0.85; letter-spacing: 0.04em; }
  .key-cap.skill { background: linear-gradient(#bfe4ff, #4a90c8); border-bottom-color: #2c5f8a; }
  .key-cap.dim { opacity: 0.35; }

  #hint { font-size: 12px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="surface"></div>

<div id="ui" class="hidden">
  <div id="top-left">
    <div id="btn-pause">☰</div>
    <div id="btn-mute" title="소리">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1c3 .9 5 3.5 5 6.7s-2 5.8-5 6.7v2.1c4.1-1 7-4.5 7-8.8s-2.9-7.8-7-8.8z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm15.5 3 2.5-2.5-1.4-1.4L18 10.6 15.4 8 14 9.4l2.6 2.6L14 14.6l1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4L19.5 12z"/></svg>
    </div>
    <div id="vitals">
      <div id="hp-bar" class="panel"><div id="hp-fill"></div></div>
      <div id="carry-wrap" class="panel hidden"><span class="dot"></span><span id="carry">0/10</span></div>
      <div id="sword-lv">Lv.1</div>
    </div>
  </div>

  <div id="top-right">
    <div id="day-chip" class="chip panel"><span id="day-icon" class="day-icon"></span><span id="day-num">1일차</span></div>
    <div class="chip panel"><span class="ico wood"></span><span id="stock-wood">0</span></div>
    <div class="chip panel"><span class="ico meat"></span><span id="stock-meat">0</span></div>
    <div id="money-pill" class="chip panel"><span class="ico cash"></span><span id="money">0</span></div>
  </div>

  <div id="action-pad">
    <div id="btn-attack" class="act-btn">A<small>공격</small></div>
    <div id="btn-skill" class="act-btn">S<small>스킬</small><div id="skill-cd"></div></div>
  </div>

  <div id="key-hints">
    <div id="key-a" class="key-cap">A<small>공격</small></div>
    <div id="key-s" class="key-cap skill">S<small>스킬</small></div>
  </div>

  <div id="toast"></div>
  <div id="hint">숲에서 나무를 베어 보세요</div>
  <div id="vignette"></div>
  <div id="damage-flash"></div>
</div>

<div id="joy"><div id="joy-knob"></div></div>

<div id="menu" class="hidden">
  <div id="menu-card" class="panel">
    <h1>화이트아웃 헌터</h1>
    <p class="en">WHITEOUT HUNTER</p>
    <button id="btn-continue" class="btn">이어하기</button>
    <button id="btn-new" class="btn ghost">새 게임</button>
    <p id="save-info" class="note">저장된 기록이 없습니다</p>
  </div>
</div>

<div id="pause" class="hidden">
  <div id="pause-card" class="panel">
    <h2>일시정지</h2>
    <button id="btn-resume" class="btn">계속하기</button>
    <button id="btn-save" class="btn ghost">저장하기</button>
    <button id="btn-sound" class="btn ghost">소리 끄기</button>
    <button id="btn-quit" class="btn ghost">저장하고 메뉴로</button>
    <p id="pause-save-info" class="note"></p>
  </div>
</div>

<div id="intro">
  <img class="splash-logo" src="./assets/yj-games.webp" alt="YJ GAMES" />
</div>

<div id="loading">불러오는 중...</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
