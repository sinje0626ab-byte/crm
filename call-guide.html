<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바른비즈 콜 가이드</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMiIgeTE9IjMiIHgyPSIyMiIgeTI9IjIxIiBncmFkaWVudFVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMkU3REY2Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMTZCMzY0Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHBhdGggZmlsbD0idXJsKCNnKSIgZD0iTTIwIDE1LjVjLTEuMjUgMC0yLjQ1LS4yLTMuNTctLjU3LS4zNS0uMTEtLjc0LS4wMy0xLjAyLjI0bC0yLjIgMi4yYy0yLjgzLTEuNDQtNS4xNS0zLjc1LTYuNTktNi41OWwyLjItMi4yMWMuMjgtLjI2LjM2LS42NS4yNS0xQzguNyA2LjQ1IDguNSA1LjI1IDguNSA0YzAtLjU1LS40NS0xLTEtMUg0Yy0uNTUgMC0xIC40NS0xIDEgMCA5LjM5IDcuNjEgMTcgMTcgMTcgLjU1IDAgMS0uNDUgMS0xdi0zLjVjMC0uNTUtLjQ1LTEtMS0xeiIvPjwvc3ZnPgo=">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#F1EFE8;
    --card:#FBFAF6;
    --card-2:#F6F4ED;
    --ink:#1B2A28;
    --ink-soft:#5A6564;
    --ink-faint:#8A928F;
    --line:#E3DFD3;
    --line-soft:#EEEAE0;
    --accent:#14735F;
    --accent-deep:#0C4A3D;
    --accent-wash:#E4EFE9;
    --alert:#BE5330;
    --alert-wash:#F6E7DE;
    --mark:#F7E38C;
    --shadow:0 1px 2px rgba(27,42,40,.06),0 8px 24px rgba(27,42,40,.07);
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo",monospace;
    --sans:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    line-height:1.6;
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
    font-size:17px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(241,239,232,.86);
    backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:820px;margin:0 auto;
    padding:12px 20px 0;
  }
  .brand-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .logo{
    font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--accent-deep);
  }
  .brand .sub{font-size:13px;color:var(--ink-faint);font-weight:500}
  .reset-btn{
    font-family:var(--sans);font-size:13.5px;font-weight:600;
    color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:5px;
  }
  .reset-btn:hover{border-color:var(--accent);color:var(--accent)}
  .reset-btn:active{transform:scale(.97)}

  .edit-btn{
    font-family:var(--sans);font-size:13.5px;font-weight:700;
    color:var(--accent-deep);background:var(--accent-wash);
    border:1px solid transparent;border-radius:999px;
    padding:7px 14px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .edit-btn:hover{filter:brightness(.97)}
  .edit-btn:active{transform:scale(.97)}
  .edit-btn.active{background:var(--alert);color:#fff}
  .edit-btn svg{width:13px;height:13px;flex-shrink:0}

  .save-flash{
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);
    opacity:0;transition:opacity .25s;display:inline-flex;align-items:center;gap:4px;
  }
  .save-flash.show{opacity:1}
  .save-flash svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

  .btn-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* editable text visual affordance */
  body.edit-mode .edit-text{
    border-radius:6px;outline:1.5px dashed var(--line);outline-offset:3px;
    background:rgba(20,115,95,.04);cursor:text;transition:.15s;
  }
  body.edit-mode .edit-text:hover{outline-color:var(--accent);background:var(--accent-wash)}
  .edit-text:focus{
    outline:2px solid var(--accent)!important;background:#fff!important;
    outline-offset:3px;box-shadow:0 0 0 4px var(--accent-wash);
  }
  body.edit-mode .say .copy{display:none}

  .tabs{display:flex;gap:4px;margin-top:12px}
  .tab{
    flex:1;position:relative;
    font-family:var(--sans);font-size:16px;font-weight:700;
    color:var(--ink-faint);background:transparent;border:none;
    padding:12px 8px 14px;cursor:pointer;
    border-bottom:2.5px solid transparent;transition:.15s;letter-spacing:-.02em;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .tab .tab-en{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;opacity:.7}
  .tab:hover{color:var(--ink-soft)}
  .tab.active{color:var(--accent-deep);border-bottom-color:var(--accent)}

  /* progress */
  .progress-wrap{max-width:820px;margin:0 auto;padding:0 20px}
  .progress{
    height:3px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:10px 0 0;
  }
  .progress-bar{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .progress-label{
    font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);
    text-align:right;margin:5px 0 12px;letter-spacing:.03em;
  }

  /* ---------- main ---------- */
  main{max-width:820px;margin:0 auto;padding:20px 20px 40px}
  .panel{display:none}
  .panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .call-head{margin:2px 0 20px}
  .call-head h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
  .call-head p{font-size:14.5px;color:var(--ink-soft);margin-top:5px}

  /* step card */
  .step{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    margin-bottom:14px;overflow:hidden;
    transition:opacity .25s,border-color .2s;
  }
  .step.done{opacity:.5}
  .step.done:hover{opacity:.85}
  .step-head{
    display:flex;align-items:flex-start;gap:13px;
    padding:16px 17px;cursor:pointer;user-select:none;
  }
  .step-num{
    flex-shrink:0;font-family:var(--mono);font-size:13px;font-weight:700;
    width:28px;height:28px;border-radius:8px;
    background:var(--accent-wash);color:var(--accent-deep);
    display:flex;align-items:center;justify-content:center;letter-spacing:0;
    margin-top:1px;transition:.2s;
  }
  .step.done .step-num{background:var(--accent);color:#fff}
  .step-titles{flex:1;min-width:0}
  .step-title{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .step-goal{font-size:13px;color:var(--ink-faint);margin-top:3px;font-weight:500}
  .check{
    flex-shrink:0;width:22px;height:22px;border-radius:7px;
    border:2px solid var(--line);background:var(--card-2);margin-top:2px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .step.done .check{background:var(--accent);border-color:var(--accent)}
  .check svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.15s;
    stroke-dasharray:20;stroke-dashoffset:20;}
  .step.done .check svg{opacity:1;stroke-dashoffset:0}

  .step-body{padding:0 17px 4px 56px}
  .step.done .step-body{display:none}

  /* spoken line */
  .say{
    position:relative;font-size:17.5px;line-height:1.75;
    color:var(--ink);padding:12px 0 12px 16px;
    border-left:2px solid var(--accent-wash);
    margin-bottom:2px;
  }
  .say + .say{border-top:1px dashed var(--line-soft)}
  .say .copy{
    position:absolute;top:10px;right:0;
    font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;
    color:var(--ink-faint);background:var(--card-2);
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;
    cursor:pointer;opacity:0;transition:.15s;
  }
  .say:hover .copy{opacity:1}
  .say .copy:hover{color:var(--accent);border-color:var(--accent)}
  .say .copy.done{color:var(--accent);border-color:var(--accent)}

  mark{
    background:linear-gradient(transparent 55%, var(--mark) 55%);
    color:var(--ink);font-weight:700;padding:0 1px;border-radius:1px;
  }
  .slot{
    font-weight:700;color:var(--accent-deep);
    border-bottom:1.5px dashed var(--accent);padding:0 2px;white-space:nowrap;
  }

  /* action / tip callouts */
  .do,.tip{
    display:flex;gap:9px;align-items:flex-start;
    font-size:14.5px;line-height:1.62;border-radius:9px;
    padding:10px 13px;margin:9px 0 4px;
  }
  .do{background:var(--accent-wash);color:var(--accent-deep)}
  .tip{background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line-soft)}
  .warn{background:var(--alert-wash);color:var(--alert)}
  .do .lab,.tip .lab,.warn .lab{
    flex-shrink:0;font-family:var(--mono);font-size:10.5px;font-weight:700;
    letter-spacing:.06em;padding:2px 7px;border-radius:5px;margin-top:1px;
  }
  .do .lab{background:var(--accent);color:#fff}
  .tip .lab{background:var(--line);color:var(--ink-soft)}
  .warn .lab{background:var(--alert);color:#fff}
  .do b,.tip b,.warn b{font-weight:700}

  /* ---------- objection FAB + overlay ---------- */
  .fab{
    position:fixed;right:20px;bottom:20px;z-index:60;
    font-family:var(--sans);font-size:16px;font-weight:800;letter-spacing:-.02em;
    color:#fff;background:var(--alert);
    border:none;border-radius:999px;padding:15px 22px 15px 18px;
    box-shadow:0 4px 14px rgba(190,83,48,.38),0 2px 4px rgba(0,0,0,.1);
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:transform .15s,box-shadow .2s;
  }
  .fab:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(190,83,48,.45)}
  .fab:active{transform:translateY(0)}
  .fab svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

  .overlay{
    position:fixed;inset:0;z-index:70;display:none;
  }
  .overlay.open{display:block}
  .scrim{
    position:absolute;inset:0;background:rgba(20,30,29,.32);
    backdrop-filter:blur(1.5px);opacity:0;transition:opacity .25s;
  }
  .overlay.open .scrim{opacity:1}
  .sheet{
    position:absolute;top:0;right:0;bottom:0;
    width:min(460px,100%);background:var(--paper);
    box-shadow:-8px 0 40px rgba(20,30,29,.18);
    display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .overlay.open .sheet{transform:none}
  .sheet-head{
    padding:16px 18px 12px;border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .sheet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .sheet-title{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
  .sheet-title .dot{width:8px;height:8px;border-radius:99px;background:var(--alert)}
  .close-x{
    background:transparent;border:none;cursor:pointer;padding:5px;border-radius:8px;
    color:var(--ink-soft);display:flex;transition:.15s;
  }
  .close-x:hover{background:var(--card-2);color:var(--ink)}
  .close-x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .search-box{position:relative}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;fill:none;stroke:var(--ink-faint);stroke-width:2;stroke-linecap:round}
  .search-box input{
    width:100%;font-family:var(--sans);font-size:15.5px;
    padding:12px 12px 12px 38px;border-radius:10px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    outline:none;transition:.15s;
  }
  .search-box input:focus{border-color:var(--alert);box-shadow:0 0 0 3px var(--alert-wash)}
  .search-box input::placeholder{color:var(--ink-faint)}

  .sheet-body{flex:1;overflow-y:auto;padding:14px 18px 28px;-webkit-overflow-scrolling:touch}
  .obj{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    margin-bottom:10px;overflow:hidden;transition:border-color .2s;
  }
  .obj.open{border-color:var(--alert)}
  .obj-btn{
    width:100%;text-align:left;background:transparent;border:none;cursor:pointer;
    padding:14px 15px;display:flex;align-items:center;gap:11px;
    font-family:var(--sans);
  }
  .obj-ico{font-size:21px;flex-shrink:0;line-height:1}
  .obj-labels{flex:1;min-width:0}
  .obj-name{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
  .obj-quote{font-size:13px;color:var(--ink-faint);margin-top:3px;font-weight:500}
  .obj-chev{flex-shrink:0;color:var(--ink-faint);transition:transform .25s}
  .obj.open .obj-chev{transform:rotate(180deg);color:var(--alert)}
  .obj-chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

  .obj-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .obj-inner{padding:2px 15px 15px}
  .layer{margin-top:12px}
  .layer:first-child{margin-top:2px}
  .layer-lab{
    font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
    padding:3px 8px;border-radius:5px;display:inline-block;margin-bottom:7px;
  }
  .l1 .layer-lab{background:var(--alert);color:#fff}
  .l2 .layer-lab{background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line)}
  .l3 .layer-lab{background:var(--accent-wash);color:var(--accent-deep)}
  .layer p{font-size:15.5px;line-height:1.7;color:var(--ink)}
  .l1 p{font-weight:600}
  .l2 p{color:var(--ink-soft);font-size:15px}
  .l2 .pts{list-style:none;padding:0;margin:0;counter-reset:pt}
  .l2 .pts li{
    position:relative;counter-increment:pt;
    font-size:15px;line-height:1.62;color:var(--ink-soft);
    padding:9px 0 9px 29px;border-top:1px dashed var(--line-soft);
  }
  .l2 .pts li:first-child{border-top:none;padding-top:2px}
  .l2 .pts li b{color:var(--ink);font-weight:700}
  .l2 .pts li::before{
    content:counter(pt);position:absolute;left:0;top:8px;
    font-family:var(--mono);font-size:11px;font-weight:700;
    width:20px;height:20px;border-radius:5px;
    background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .l2 .pts li:first-child::before{top:1px}

  .no-result{text-align:center;color:var(--ink-faint);font-size:14.5px;padding:36px 10px}

  /* footer note */
  .foot{max-width:820px;margin:8px auto 0;padding:0 20px;
    font-size:12.5px;color:var(--ink-faint);line-height:1.6}

  @media (max-width:520px){
    .topbar-inner,main,.progress-wrap,.foot{padding-left:15px;padding-right:15px}
    .brand-row{flex-wrap:wrap;row-gap:8px}
    .btn-group{width:100%;justify-content:flex-end}
    .step-body{padding-left:48px}
    .say{font-size:16.5px}
    .fab{right:14px;bottom:14px;padding:14px 19px 14px 16px;font-size:15px}
    .call-head h1{font-size:21px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="logo">바른비즈</span>
        <span class="sub">콜 가이드 · 정책자금 상담</span>
      </div>
      <div class="btn-group">
        <span class="save-flash" id="saveFlash">
          <svg viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 6"/></svg>저장됨
        </span>
        <button class="edit-btn" id="editBtn" onclick="toggleEditMode()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span class="editBtnLabel">멘트 수정</span>
        </button>
        <button class="reset-btn" id="resetEditsBtn" onclick="resetEdits()" style="display:none">
          원본으로
        </button>
        <button class="reset-btn" onclick="resetCall()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          새 상담
        </button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="call1" onclick="switchTab('call1')">
        1차콜 · 상담<span class="tab-en">SCREENING</span>
      </button>
      <button class="tab" data-tab="call2" onclick="switchTab('call2')">
        2차콜 · 계약<span class="tab-en">CLOSING</span>
      </button>
      <button class="tab" data-tab="call3" onclick="switchTab('call3')">
        접수 전 확인<span class="tab-en">CONSENT</span>
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress"><div class="progress-bar" id="progBar"></div></div>
    <div class="progress-label" id="progLabel">0 / 0 단계</div>
  </div>
</div>

<main>
  <!-- ============ 1차콜 ============ -->
  <section class="panel active" id="call1">
    <div class="call-head">
      <h1>1차콜 — 상담</h1>
      <p>목표: 니즈 확인하고 스크리닝 → 검토 후 재연락 약속으로 <b>2차콜 예약</b></p>
    </div>
  </section>

  <!-- ============ 2차콜 ============ -->
  <section class="panel" id="call2">
    <div class="call-head">
      <h1>2차콜 — 계약</h1>
      <p>목표: 조건·비용 투명하게 설명하고 <b>모두싸인 계약 확정</b></p>
    </div>
  </section>

  <!-- ============ 접수 전 확인 ============ -->
  <section class="panel" id="call3">
    <div class="call-head">
      <h1>접수 전 확인 — 녹취·계약 재고지</h1>
      <p>목표: 재단 접수 <b>직전</b>, 녹취 동의 + 계약 내용(자문료 지불 의무) <b>재확인</b> 후 접수</p>
    </div>
  </section>
</main>

<div class="foot">
  <span class="slot">점선 밑줄</span> 부분은 고객마다 바꿔서 말하는 값이에요. · 우측 하단 <b style="color:var(--alert)">반론 대응</b> 버튼은 두 탭 어디서나 눌러 쓸 수 있어요.
</div>

<!-- floating objection button -->
<button class="fab" onclick="openObj()">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
  반론 대응
</button>

/* ---------------- edit mode / local persistence ---------------- */
const EDIT_KEY = 'bareunbiz_call_guide_edits_v1';
let EDITS = {};
try{ EDITS = JSON.parse(localStorage.getItem(EDIT_KEY)) || {}; }catch(e){ EDITS = {}; }
let EDIT_MODE = false;
let saveTimer = null;

function applyEdit(key, defaultHtml){
  return Object.prototype.hasOwnProperty.call(EDITS,key) ? EDITS[key] : defaultHtml;
}
function saveEditsNow(){
  try{ localStorage.setItem(EDIT_KEY, JSON.stringify(EDITS)); flashSaved(); }
  catch(e){ console.error('저장 실패', e); }
}
function saveEditsDebounced(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveEditsNow, 500);
}
function flashSaved(){
  const el = document.getElementById('saveFlash');
  if(!el) return;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'),1300);
}
function wireEditable(root){
  root.querySelectorAll('[data-key]').forEach(el=>{
    el.contentEditable = EDIT_MODE ? 'true' : 'false';
    if(!el.dataset.wired){
      el.dataset.wired = '1';
      el.addEventListener('input', ()=>{
        EDITS[el.dataset.key] = el.innerHTML;
        saveEditsDebounced();
      });
      el.addEventListener('blur', ()=>{
        EDITS[el.dataset.key] = el.innerHTML;
        saveEditsNow();
      });
    }
  });
}
function toggleEditMode(){
  EDIT_MODE = !EDIT_MODE;
  document.body.classList.toggle('edit-mode', EDIT_MODE);
  document.querySelectorAll('[data-key]').forEach(el=>{ el.contentEditable = EDIT_MODE ? 'true' : 'false'; });
  const btn = document.getElementById('editBtn');
  btn.classList.toggle('active', EDIT_MODE);
  btn.querySelector('.editBtnLabel').textContent = EDIT_MODE ? '수정 완료' : '멘트 수정';
  document.getElementById('resetEditsBtn').style.display = EDIT_MODE ? 'inline-flex' : 'none';
}
function resetEdits(){
  if(!confirm('수정한 멘트를 전부 원본으로 되돌릴까요? 이 작업은 되돌릴 수 없어요.')) return;
  localStorage.removeItem(EDIT_KEY);
  location.reload();
}

/* ---------------- render steps ---------------- */
function renderSteps(list, mountId, prefix){
  const mount = document.getElementById(mountId);
  list.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className='step';
    let body = '';
    (s.say||[]).forEach((line,j)=>{
      const key = `${prefix}-${i}-say-${j}`;
      body += `<div class="say"><button class="copy" onclick="copyLine(event)">복사</button><span class="edit-text" data-key="${key}">${applyEdit(key,line)}</span></div>`;
    });
    (s.do||[]).forEach((d,j)=>{
      const key = `${prefix}-${i}-do-${j}`;
      body += `<div class="do"><span class="lab">할 일</span><span class="edit-text" data-key="${key}">${applyEdit(key,d)}</span></div>`;
    });
    (s.warn||[]).forEach((w,j)=>{
      const key = `${prefix}-${i}-warn-${j}`;
      body += `<div class="warn"><span class="lab">주의</span><span class="edit-text" data-key="${key}">${applyEdit(key,w)}</span></div>`;
    });
    (s.tip||[]).forEach((t,j)=>{
      const key = `${prefix}-${i}-tip-${j}`;
      body += `<div class="tip"><span class="lab">팁</span><span class="edit-text" data-key="${key}">${applyEdit(key,t)}</span></div>`;
    });
    el.innerHTML = `
      <div class="step-head" onclick="toggleStep(this)">
        <span class="step-num">${String(i+1).padStart(2,'0')}</span>
        <div class="step-titles">
          <div class="step-title">${s.title}</div>
          <div class="step-goal">${s.goal}</div>
        </div>
        <span class="check"><svg viewBox="0 0 24 24"><path d="M5 12l4.5 4.5L19 6"/></svg></span>
      </div>
      <div class="step-body">${body}</div>`;
    mount.appendChild(el);
  });
  wireEditable(mount);
}
renderSteps(CALL1,'call1','call1');
renderSteps(CALL2,'call2','call2');
renderSteps(CALL3,'call3','call3');

/* ---------------- render objections ---------------- */
OBJECTIONS.forEach((o,idx)=>{ o._idx = idx; });
function renderObj(filter=''){
  const mount = document.getElementById('objList');
  const f = filter.trim().toLowerCase();
  const items = OBJECTIONS.filter(o=>{
    if(!f) return true;
    return (o.name+o.quote+o.key).toLowerCase().includes(f);
  });
  if(items.length===0){ mount.innerHTML = `<div class="no-result">검색 결과가 없어요.<br>'비용', '사기', '생각' 처럼 짧게 검색해보세요.</div>`; return; }
  mount.innerHTML = items.map(o=>{
    const idx = o._idx;
    const l1key = `obj-${idx}-l1`;
    const l3key = `obj-${idx}-l3`;
    let l2html;
    if(Array.isArray(o.l2)){
      const l2key = `obj-${idx}-l2`;
      const defaultList = `<ol class="pts">${o.l2.map(p=>`<li>${p}</li>`).join('')}</ol>`;
      l2html = `<div class="edit-text" data-key="${l2key}">${applyEdit(l2key,defaultList)}</div>`;
    } else {
      const l2key = `obj-${idx}-l2`;
      l2html = `<p class="edit-text" data-key="${l2key}">${applyEdit(l2key,o.l2)}</p>`;
    }
    return `
    <div class="obj">
      <button class="obj-btn" onclick="toggleObj(this)">
        <span class="obj-ico">${o.ico}</span>
        <span class="obj-labels">
          <span class="obj-name">${o.name}</span>
          <span class="obj-quote">${o.quote}</span>
        </span>
        <span class="obj-chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
      <div class="obj-body"><div class="obj-inner">
        <div class="layer l1"><span class="layer-lab">즉답</span><p class="edit-text" data-key="${l1key}">${applyEdit(l1key,o.l1)}</p></div>
        <div class="layer l2"><span class="layer-lab">풀어서</span>${l2html}</div>
        <div class="layer l3"><span class="layer-lab">이어서 클로징</span><p class="edit-text" data-key="${l3key}">${applyEdit(l3key,o.l3)}</p></div>
      </div></div>
    </div>`;}).join('');
  wireEditable(mount);
}
renderObj();



/* ---------------- interactions ---------------- */
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));
  updateProgress();
}
function toggleStep(head){
  head.closest('.step').classList.toggle('done');
  updateProgress();
}
function updateProgress(){
  const panel = document.querySelector('.panel.active');
  const steps = panel.querySelectorAll('.step');
  const done = panel.querySelectorAll('.step.done').length;
  const pct = steps.length ? Math.round(done/steps.length*100) : 0;
  document.getElementById('progBar').style.width = pct+'%';
  document.getElementById('progLabel').textContent = `${done} / ${steps.length} 단계`;
}
function resetCall(){
  document.querySelectorAll('.step.done').forEach(s=>s.classList.remove('done'));
  document.querySelector('main').scrollIntoView({behavior:'smooth',block:'start'});
  updateProgress();
}
function copyLine(e){
  e.stopPropagation();
  const btn = e.currentTarget;
  const say = btn.closest('.say');
  const txt = say.textContent.replace('복사','').trim();
  navigator.clipboard?.writeText(txt).then(()=>{
    btn.textContent='복사됨'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='복사'; btn.classList.remove('done');},1400);
  });
}
function openObj(){
  document.getElementById('objOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('objSearch').focus(),260);
}
function closeObj(){ document.getElementById('objOverlay').classList.remove('open'); }
function filterObj(v){ renderObj(v); }
function toggleObj(btn){
  const obj = btn.closest('.obj');
  const body = obj.querySelector('.obj-body');
  const isOpen = obj.classList.contains('open');
  if(isOpen){ obj.classList.remove('open'); body.style.maxHeight=null; }
  else{ obj.classList.add('open'); body.style.maxHeight = body.scrollHeight+'px'; }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeObj();
});
updateProgress();
</script>
